name: osc-api-deploy release build

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      api_version:
        description: 'Outscale API version'
        required: true

jobs:
  auto-build:
    environment: auto-build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Set up Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: '4.0'
      - name: Write Outscale API version to use
        env:
          API_VERSION: ${{ github.event.inputs.api_version }}
        run: echo "$API_VERSION" > api_version
      - name: check version duplication
        run: .github/scripts/release-check-duplicate.sh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: auto-generate release
        env:
          API_VERSION: ${{ github.event.inputs.api_version }}
        run: ./build.sh "$API_VERSION"
      - name: push release branch
        run: .github/scripts/release-push.sh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: create pull request
        run: .github/scripts/release-pr.sh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
