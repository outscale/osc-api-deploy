name: osc-api-deploy check PR

permissions:
  contents: read

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - outscale.yaml
      - outscale-go.yaml
      - outscale-java.yaml

jobs:
  breaking-change-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        spec:
          - outscale.yaml
          - outscale-go.yaml
          - outscale-java.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: ${{ matrix.spec }}
          path: ./base
          ref: ${{ github.base_ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: ${{ matrix.spec }}
          path: ./revision
      - name: Checking breaking changes on ${{ matrix.spec }}
        uses: oasdiff/oasdiff-action/breaking@50e6a3413e5aa9c3ae4d8393c34745be44288b46 # main
        with:
          base: ./base/${{ matrix.spec }}
          revision: ./revision/${{ matrix.spec }}
          fail-on: ERR

  lint:
    name: Run Spectral
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # Check out the repository
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Run Spectral
      - uses: stoplightio/spectral-action@6416fd018ae38e60136775066eb3e98172143141 # latest
        with:
          file_glob: 'outscale-*.yaml'
