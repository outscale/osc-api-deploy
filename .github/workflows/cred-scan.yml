name: Credential Scanner

on:
  pull_request:
    branches: [ main ]


permissions:
  contents: read

jobs:
  cred-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Scan credentials
      uses: outscale/cred-scan@main
      with:
        scan_path: "./"
